[project]
name = "diffusiongym"
version = "0.1.0"
description = "DiffusionGym extension with new finetuning algorithms and port to PyG"
readme = "README.md"
authors = [
    { name = "QuantumDuck", email = "40206399+BrokenDuck@users.noreply.github.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets>=5.0.0",
    "diffusers>=0.39.0",
    "flowmol",
    "meeko>=0.7.1",
    "numpy>=2.4.6",
    "open-clip-torch>=3.3.0",
    "pandas>=3.0.5",
    "polars>=1.43.1",
    "prody>=2.6.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyg-lib>=0.8.0",
    "pytorch-geometric>=0.0.2",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.4",
    "rdkit-stubs>=0.8",
    "scipy>=1.18.0",
    "torch<2.13",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torchdata>=0.11.0",
    "torchvision>=0.27.1",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "typing-extensions>=4.16.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
pyg-lib = { index = "pyg" }
torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }
flowmol = { workspace = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.12.0+cu132.html"
format = "flat"
explicit = true

[project.scripts]
diffusiongym = "diffusiongym:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
    "B",      # bugbear
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming conventions
    "W",      # pycodestyle warnings
    "C4",     # comprehensions
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PIE",    # misc lints
    "PYI",    # flake8-pyi
    "TID",    # tidy imports
    "TCH",    # type-checking imports
    "RUF",    # Ruff-specific rules
    "RSE",    # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "N806",    # Non-lowercase variable in function
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "D105",    # Docstring in dunder methods
    "N812",
    "D102",
    "D101",
    "RUF001",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.mypy]
files = ["diffusiongym"]
strict = true
pretty = true
[[tool.mypy.overrides]]
module = [
    "torchvision",
    "torchvision.*",
    "rdkit",
    "rdkit.*",
    "flowmol",
    "flowmol.*",
    "torch_scatter",
    "torch_scatter.*",
    "meeko",
    "meeko.*",
]
ignore_missing_imports = true
